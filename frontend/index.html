<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Voxera</title>
  <link rel="stylesheet" href="css/main.css" />
</head>
<body>
  <main class="card">
    <h1>VOXERA</h1>
    <p class="tagline">AI Voice Agent Platform</p>

    <div class="status" id="overall">System Online</div>

    <form id="auth-form" class="auth" onsubmit="return false;">
      <label>
        <span>Email</span>
        <input type="email" id="email" autocomplete="username" required />
      </label>
      <label>
        <span>Password</span>
        <input type="password" id="password" autocomplete="current-password" required minlength="6" />
      </label>
      <label>
        <span>Org name <small>(only for signup)</small></span>
        <input type="text" id="org" placeholder="Acme Motors" />
      </label>
      <div class="buttons">
        <button type="button" id="btn-login">Login</button>
        <button type="button" id="btn-register">Sign up</button>
      </div>
    </form>

    <div class="result" id="result">Not authenticated</div>
  </main>
  <script src="js/app.js"></script>
</body>
</html>
